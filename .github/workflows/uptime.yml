name: 監視履歴をGitHubに保存
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/uptime.yml
      - scripts/archive-cloudflare.mjs
      - src/monitor-state.js
permissions:
  contents: write
concurrency:
  group: gaisen-uptime
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1
      - name: 保存済みの監視履歴を取得
        run: node scripts/archive-cloudflare.mjs
      - name: 履歴をGitHubに保存
        run: |
          git config user.name 'Gaisen NOW Status'
          git config user.email '73812536+upptime-bot@users.noreply.github.com'
          git add history/cloudflare-state.json status-data.json
          git diff --cached --quiet && exit 0
          git commit -m 'Archive autonomous monitoring history [skip ci]'
          git push
